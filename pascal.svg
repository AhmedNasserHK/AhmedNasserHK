<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pascalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#42A5F5"/>
    </linearGradient>
  </defs>
  
  <rect x="10" y="10" width="80" height="80" rx="15" fill="url(#pascalGrad)" stroke="#1976D2" stroke-width="2"/>
  
  <text x="50" y="40" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Pascal</text>
  
  <!-- Pascal triangle shape -->
  <polygon points="35,55 50,70 65,55" fill="none" stroke="white" stroke-width="3"/>
  
  <!-- Code brackets -->
  <text x="50" y="85" text-anchor="middle" fill="white" font-family="monospace" font-size="14" font-weight="bold">{ }</text>
</svg>